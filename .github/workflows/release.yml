name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance (SLSA attestation) via OIDC
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build matrix + assemble packages
        run: scripts/build-dist.sh "${{ steps.v.outputs.version }}"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/argus-*.tar.gz
            dist/checksums.txt
      - name: Publish platform packages
        # Fail-closed: any publish that ultimately fails aborts the job, so a
        # partial matrix never ships with the main package on top of it. Each
        # publish retries to ride out a transient registry/network error.
        run: |
          set -euo pipefail
          publish() {
            for attempt in 1 2 3; do
              if npm publish "$1" --access public --provenance; then return 0; fi
              echo "publish $1 failed (attempt $attempt/3), retrying in 15s..." >&2
              sleep 15
            done
            echo "publish $1 failed after 3 attempts" >&2
            return 1
          }
          for s in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            publish "./npm/argus-$s"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish main package
        # Published last, after every platform package it depends on exists.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm publish ./npm/argus --access public --provenance; then exit 0; fi
            echo "publish main failed (attempt $attempt/3), retrying in 15s..." >&2
            sleep 15
          done
          echo "publish main failed after 3 attempts" >&2
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
